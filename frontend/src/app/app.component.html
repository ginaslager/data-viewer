<div class="app-shell">

  <!-- Top header: full width -->
  <header class="app-header">
    <div class="header-brand">
      <div class="logo-shape"><span class="logo-shape-inner">DV</span></div>
      <div class="brand-text">
        <span class="brand-name">Data<em>Viewer</em></span>
        <span class="brand-sub">Generic &nbsp;·&nbsp; V2.0.0</span>
      </div>
    </div>
    <div class="header-right">
      @let activeTheme = (theme$ | async);
      <div class="theme-dropdown" [class.open]="themeOpen">
        <button class="theme-trigger" (click)="themeOpen = !themeOpen">
          <svg class="theme-icon" width="13" height="13" viewBox="0 0 14 14" fill="none">
            @switch (activeTheme ?? 'carbon') {
              @case ('carbon') {
                <path d="M9.9 2.9 A5 5 0 1 0 9.9 11.1 A4.3 4.3 0 0 1 9.9 2.9 Z" fill="currentColor"/>
              }
              @case ('slate') {
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 1.5a5.5 5.5 0 0 1 0 11V1.5z" fill="currentColor"/>
              }
              @case ('ivory') {
                <circle cx="7" cy="7" r="2.5" fill="currentColor"/>
                <line x1="7" y1="1" x2="7" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="7" y1="11" x2="7" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="1" y1="7" x2="3" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="11" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="3" y1="3" x2="4.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="9.5" y1="9.5" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="11" y1="3" x2="9.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="4.5" y1="9.5" x2="3" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              }
              @case ('soft') {
                <rect x="2" y="2" width="10" height="10" rx="3" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="7" cy="7" r="2" fill="currentColor"/>
              }
            }
          </svg>
          <span class="theme-trigger-label">{{ themeLabel(activeTheme ?? 'carbon') }}</span>
          <span class="theme-trigger-arrow">{{ themeOpen ? '▴' : '▾' }}</span>
        </button>
        @if (themeOpen) {
          <div class="theme-menu">
            @for (t of themes; track t.id) {
              <button class="theme-option" [class.active]="activeTheme === t.id" (click)="chooseTheme(t.id)">
                <svg class="theme-icon" width="13" height="13" viewBox="0 0 14 14" fill="none">
                  @switch (t.id) {
                    @case ('carbon') {
                      <path d="M9.9 2.9 A5 5 0 1 0 9.9 11.1 A4.3 4.3 0 0 1 9.9 2.9 Z" fill="currentColor"/>
                    }
                    @case ('slate') {
                      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                      <path d="M7 1.5a5.5 5.5 0 0 1 0 11V1.5z" fill="currentColor"/>
                    }
                    @case ('ivory') {
                      <circle cx="7" cy="7" r="2.5" fill="currentColor"/>
                      <line x1="7" y1="1" x2="7" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="7" y1="11" x2="7" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="1" y1="7" x2="3" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="11" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="3" y1="3" x2="4.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="9.5" y1="9.5" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="11" y1="3" x2="9.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      <line x1="4.5" y1="9.5" x2="3" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    }
                    @case ('soft') {
                      <rect x="2" y="2" width="10" height="10" rx="3" stroke="currentColor" stroke-width="1.4"/>
                      <circle cx="7" cy="7" r="2" fill="currentColor"/>
                    }
                  }
                </svg>
                {{ t.label }}
              </button>
            }
          </div>
        }
      </div>
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    </div>
  </header>

  <!-- Body: sidebar + content -->
  <div class="app-body" [class.sidebar-collapsed]="sidebarCollapsed">

    <!-- Left sidebar -->
    <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
      <div class="sidebar-nav">
        @if (!sidebarCollapsed) {
          <p class="nav-label">Menu</p>
        }

        <button class="nav-item" [class.active]="activeNav === 'overzicht'"
                [title]="sidebarCollapsed ? 'Data Viewer' : ''"
                (click)="setNav('overzicht')">
          <svg class="nav-icon" width="15" height="15" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          @if (!sidebarCollapsed) {
            <span class="nav-arrow">{{ activeNav === 'overzicht' ? '▶' : '▷' }}</span>
            Data Viewer
          }
        </button>

        <button class="nav-item" [class.active]="activeNav === 'upload'"
                [title]="sidebarCollapsed ? 'Upload' : ''"
                (click)="setNav('upload')">
          <svg class="nav-icon" width="15" height="15" viewBox="0 0 14 14" fill="none">
            <path d="M7 9V2M4 5l3-3 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 11h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          @if (!sidebarCollapsed) {
            <span class="nav-arrow">{{ activeNav === 'upload' ? '▶' : '▷' }}</span>
            Upload
          }
        </button>

        <button class="nav-item" [class.active]="activeNav === 'instellingen'"
                [title]="sidebarCollapsed ? 'Instellingen' : ''"
                (click)="setNav('instellingen')">
          <svg class="nav-icon" width="15" height="15" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.9 2.9l1.1 1.1M10 10l1.1 1.1M2.9 11.1L4 10M10 4l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          @if (!sidebarCollapsed) {
            <span class="nav-arrow">{{ activeNav === 'instellingen' ? '▶' : '▷' }}</span>
            Instellingen
          }
        </button>
      </div>

      <div class="sidebar-bottom">
        @if (!sidebarCollapsed && (activeFilterCount$ | async)! > 0) {
          <button class="btn-wis" (click)="clearFilters()">Filters wissen</button>
        }
        <button class="sidebar-toggle" (click)="toggleSidebar()" [title]="sidebarCollapsed ? 'Uitklappen' : 'Inklappen'">
          <svg width="12" height="12" viewBox="0 0 10 10" fill="none">
            @if (sidebarCollapsed) {
              <path d="M3.5 2L6.5 5l-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            } @else {
              <path d="M6.5 2L3.5 5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            }
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

      <section class="panel panel--table" [hidden]="activeNav !== 'overzicht'">
        <app-data-table (navigateTo)="setNav($event)" />
      </section>

      <section class="panel" [hidden]="activeNav !== 'upload'">
        <app-upload-zone />
      </section>

      <section class="panel" [hidden]="activeNav !== 'instellingen'">
        <app-instellingen />
      </section>
    </main>

  </div>
</div>
